name: Terbitkan Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cek hash APK
        run: cd dist && sha256sum -c SHA256.txt

      - name: Buat Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Benyek SAMP ${GITHUB_REF_NAME#v} (uji coba)" \
            --prerelease \
            --notes-file dist/NOTES.md \
            dist/*.apk dist/SHA256.txt
