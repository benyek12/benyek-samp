name: Terbitkan Release

on:
  push:
    branches: [main]
    paths: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cek hash APK
        run: cd dist && sha256sum -c SHA256.txt

      - name: Buat Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < dist/VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG sudah ada, file diperbarui"
            gh release upload "$TAG" dist/*.apk dist/SHA256.txt --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Benyek SAMP ${VERSION} (uji coba)" \
              --prerelease \
              --notes-file dist/NOTES.md \
              dist/*.apk dist/SHA256.txt
          fi
